name: Build & Deploy API

on:
  push:
    branches: [main]
    paths:
      - packages/api/**
      - packages/shared/**
      - packages/sdk/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/api/Dockerfile
          push: true
          tags: |
            ghcr.io/marlinjai/storage-brain-api:latest
            ghcr.io/marlinjai/storage-brain-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-verify:
    needs: build-and-push
    permissions:
      contents: read
      deployments: write
    uses: marlinjai/actions-shared/.github/workflows/coolify-deploy-verify.yml@v1.1.0
    with:
      health_url: https://api.storage-brain.lumitra.co/health
      environment: production-api
    secrets:
      coolify_webhook: ${{ secrets.COOLIFY_WEBHOOK_API }}
      coolify_token: ${{ secrets.COOLIFY_TOKEN }}
