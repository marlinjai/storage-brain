name: Verify

# Quality gates: build + typecheck + lint + test on every PR and on pushes to
# main. These were never enforced in CI before (only deploy workflows existed),
# so eslint and tsc silently rotted. This job keeps them honest.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The root ROADMAP.md is the only index of open work; plans under docs/plans/
  # are the only place content lives. Rule: knowledge-base
  # standards/document-lifecycle.md, section 4.
  roadmap-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: marlinjai/actions-shared/roadmap-check@roadmap-check-v1
        with:
          max-age: 30

  verify:
    runs-on: ubuntu-latest
    # A real Postgres for the adapter's quota-accounting contract
    # (packages/api/src/adapters/database/postgres.quota.spec.ts), whose
    # concurrency cases need a real server rather than an in-process shim.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node so the node cache: pnpm step can find it.
      # Version is read from the package.json "packageManager" field (pnpm@9.15.0),
      # matching the corepack-pinned version used in the deploy Dockerfiles.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build runs first so packages/shared and packages/sdk emit their dist/.d.ts;
      # without them the type-aware eslint and tsc see cross-package imports as `any`.
      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # Prettier drifted on main once already; this keeps it from drifting again.
      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
