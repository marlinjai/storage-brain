name = "storage-brain-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "storage-brain-db"
database_id = "4ed90c66-738c-4199-893a-158f24b5c50b"

# R2 Bucket binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "storage-brain-files"

# Environment variables (non-secret)
[vars]
ENVIRONMENT = "production"
# auth-brain machine-auth (slice 2B). Optional: unset AUTH_BRAIN_URL -> the
# auth-brain branch is skipped and only legacy tenant keys work. The OpenFGA
# authorization check runs server-side inside auth-brain's verify endpoint, so
# this one non-secret URL is the only auth-brain config the Worker needs.
AUTH_BRAIN_URL = "https://auth.lumitra.co"

# Staging environment
[env.staging]
name = "storage-brain-api-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
AUTH_BRAIN_URL = "https://auth.lumitra.co"

# Production environment
[env.production]
name = "storage-brain-api"
[env.production.vars]
ENVIRONMENT = "production"
AUTH_BRAIN_URL = "https://auth.lumitra.co"
